apiVersion: v1
kind: Pod
metadata:
  name: nginx-distroless
  namespace: kubernetes-debug
  labels:
    app: nginx-distroless
spec:
  containers:
    - name: nginx
      image: kyos0109/nginx-distroless:latest
      ports:
        - name: http
          containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 10
        periodSeconds: 20

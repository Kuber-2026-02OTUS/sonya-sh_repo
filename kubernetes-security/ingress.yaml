apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homework-ingress
  namespace: homework
spec:
  ingressClassName: nginx
  rules:
    - host: homework.otus
      http:
        paths:
          - path: /index.html
            pathType: Exact
            backend:
              service:
                name: homework-service
                port:
                  number: 80
          - path: /conf/file
            pathType: Exact
            backend:
              service:
                name: homework-service
                port:
                  number: 80
          - path: /metrics.html
            pathType: Exact
            backend:
              service:
                name: homework-service
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homework-homepage-ingress
  namespace: homework
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /index.html
spec:
  ingressClassName: nginx
  rules:
    - host: homework.otus
      http:
        paths:
          - path: /homepage
            pathType: Exact
            backend:
              service:
                name: homework-service
                port:
                  number: 80

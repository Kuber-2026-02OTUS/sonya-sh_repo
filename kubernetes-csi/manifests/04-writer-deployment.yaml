apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-s3-writer
  namespace: dz12-csi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csi-s3-writer
  template:
    metadata:
      labels:
        app: csi-s3-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /data/dz12
              while true; do
                date -Iseconds >> /data/dz12/heartbeat.txt
                echo "pod=$(hostname)" >> /data/dz12/heartbeat.txt
                sleep 30
              done
          volumeMounts:
            - name: s3-volume
              mountPath: /data
      volumes:
        - name: s3-volume
          persistentVolumeClaim:
            claimName: csi-s3-pvc

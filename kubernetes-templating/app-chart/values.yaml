namespace: homework

replicaCount: 3

image:
  repository: python
  tag: "3.9-alpine"

initContainer:
  image:
    repository: busybox
    tag: "1.36"

service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: homework.otus

probes:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10

dependency:
  enabled: false

global:
  security:
    allowInsecureImages: true

redis:
  architecture: standalone
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.4-debian-11-r0
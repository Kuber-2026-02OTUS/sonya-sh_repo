apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dz8-monitoring
data:
  default.conf: |
    server {
      listen 8080;

      location / {
        default_type text/plain;
        return 200 "Hello\n";
      }

      location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
      }
    }

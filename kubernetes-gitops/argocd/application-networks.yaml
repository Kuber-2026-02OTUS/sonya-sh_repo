apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homework-networks
  namespace: argocd
spec:
  project: otus
  source:
    repoURL: https://github.com/Kuber-2026-02OTUS/sonya-sh_repo.git
    targetRevision: kubernetes-gitops
    path: kubernetes-networks
  destination:
    server: https://kubernetes.default.svc
    namespace: homework
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

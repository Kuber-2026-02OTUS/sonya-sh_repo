[control_plane]
kubeadm-cp-1 ansible_host=REPLACE_WITH_EXTERNAL_IP private_ip=REPLACE_WITH_INTERNAL_IP

[workers]
kubeadm-worker-1 ansible_host=REPLACE_WITH_EXTERNAL_IP private_ip=REPLACE_WITH_INTERNAL_IP
kubeadm-worker-2 ansible_host=REPLACE_WITH_EXTERNAL_IP private_ip=REPLACE_WITH_INTERNAL_IP
kubeadm-worker-3 ansible_host=REPLACE_WITH_EXTERNAL_IP private_ip=REPLACE_WITH_INTERNAL_IP

[kubeadm_cluster:children]
control_plane
workers

[kubeadm_cluster:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
control_plane_host=kubeadm-cp-1

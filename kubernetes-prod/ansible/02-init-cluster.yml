---
- name: Initialize kubeadm control plane
  hosts: control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Initialize cluster
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ private_ip }}
        --pod-network-cidr={{ pod_network_cidr }}
        --kubernetes-version={{ kubernetes_initial_semver }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        remote_src: true

    - name: Install Flannel CNI
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply
        -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      changed_when: true

    - name: Create join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Store join command for worker play
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_command.stdout }}"

- name: Join workers
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Join node to cluster
      ansible.builtin.command: "{{ hostvars[control_plane_host].kubeadm_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
